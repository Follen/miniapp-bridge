name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SemVer tag to publish
        required: true
        type: string

permissions:
  contents: read

env:
  NATIVE_ARCHIVE_SHA256: A63B7F121794DD9C6D51CAC9F47C6D0CE43EB61E753AC23075845630F6A76BFD

concurrency:
  group: release-native-17.3.2-abi1.1
  queue: max
  cancel-in-progress: false

jobs:
  prepare:
    name: Promote verified main candidate
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    environment: production-release
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_version: ${{ steps.version.outputs.release_version }}
      source_commit: ${{ steps.version.outputs.source_commit }}
      native_tag: ${{ steps.version.outputs.native_tag }}
    steps:
      - name: Check out the requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}

      - name: Validate release tag and main source commit
        id: version
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $semver = '^v(0|1)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          if ($env:REQUESTED_TAG -cnotmatch $semver) { throw "invalid release tag: $env:REQUESTED_TAG" }
          git fetch --force --tags origin
          git fetch --force origin main
          if ($LASTEXITCODE -ne 0) { throw 'tag or main fetch failed' }
          $tagCommit = (git rev-list -n 1 "refs/tags/$env:REQUESTED_TAG").Trim()
          if ((git rev-parse HEAD).Trim() -cne $tagCommit) { throw 'checked out source and tag peeled commit differ' }
          if ($env:EVENT_NAME -eq 'push' -and $tagCommit -cne $env:TRIGGER_SHA) { throw 'tag push SHA and tag peeled commit differ' }
          git merge-base --is-ancestor $tagCommit origin/main
          if ($LASTEXITCODE -ne 0) { throw "tag commit is not in main history: $tagCommit" }
          "release_tag=$env:REQUESTED_TAG" >> $env:GITHUB_OUTPUT
          "release_version=$($env:REQUESTED_TAG.Substring(1))" >> $env:GITHUB_OUTPUT
          "source_commit=$tagCommit" >> $env:GITHUB_OUTPUT
          'native_tag=native-v17.3.2-abi1.1' >> $env:GITHUB_OUTPUT

      - name: Download exact main release candidate
        id: candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.version.outputs.source_commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runs = @(gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=$env:SOURCE_COMMIT&status=success&per_page=20" --jq '.workflow_runs[].id')
          if ($runs.Count -eq 0) { throw "no successful main CI run exists for $env:SOURCE_COMMIT" }
          $downloaded = $false
          foreach ($run in $runs) {
            gh run download $run --repo $env:GITHUB_REPOSITORY --name "release-candidate-$env:SOURCE_COMMIT" --dir dist\candidate
            if ($LASTEXITCODE -eq 0) {
              "main_run_id=$run" >> $env:GITHUB_OUTPUT
              $downloaded = $true
              break
            }
          }
          if (-not $downloaded) { throw "verified main candidate is missing for $env:SOURCE_COMMIT" }
          .\scripts\release-candidate.ps1 -Mode Verify -SourceCommit $env:SOURCE_COMMIT

      - name: Package and describe promoted candidate
        shell: pwsh
        run: .\scripts\promote-release.ps1 -ReleaseTag '${{ steps.version.outputs.release_tag }}' -SourceCommit '${{ steps.version.outputs.source_commit }}' -CandidateDirectory dist\candidate -MainRunID '${{ steps.candidate.outputs.main_run_id }}'

      - name: Attest promoted release bundle
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-checksums: ${{ runner.temp }}\release-attestation-SHA256SUMS

      - name: Clean promoted attestation input
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'release-attestation-SHA256SUMS') -Force -ErrorAction SilentlyContinue

      - name: Upload promoted release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.version.outputs.release_tag }}-windows-amd64
          path: dist/release
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish GitHub Releases
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    environment: production-release
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      NATIVE_TAG: ${{ needs.prepare.outputs.native_tag }}
      NATIVE_ASSET: miniapp-frida-native-17.3.2-abi1.1-windows-amd64.zip
    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.prepare.outputs.release_tag }}-windows-amd64
          path: release-bundle

      - name: Verify downloaded checksums
        shell: bash
        run: |
          set -euo pipefail
          expected_assets=(
            "miniapp-bridge-$RELEASE_TAG-windows-amd64.zip"
            "$NATIVE_ASSET"
            'manifest.json'
            'miniapp-bridge.cdx.json'
            'provenance.intoto.json'
            'LICENSE'
            'THIRD_PARTY_NOTICES.md'
            'FRIDA_COPYING'
            'FRIDA_COPYING.LIB'
            'ZLIB_LICENSE'
          )
          mapfile -t actual_assets < <(awk 'NF == 2 { print $2 }' release-bundle/SHA256SUMS | sort)
          mapfile -t expected_assets < <(printf '%s\n' "${expected_assets[@]}" | sort)
          if [[ "${actual_assets[*]}" != "${expected_assets[*]}" ]]; then
            printf 'release checksum asset set mismatch\nactual: %s\nexpected: %s\n' \
              "${actual_assets[*]}" "${expected_assets[*]}" >&2
            exit 1
          fi
          (cd release-bundle && sha256sum --check SHA256SUMS)
          (cd release-bundle/native-compat && sha256sum --check SHA256SUMS)

      - name: Verify GitHub provenance attestations
        shell: bash
        run: |
          set -euo pipefail
          while read -r digest asset; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            [[ "$asset" =~ ^[^/\\]+$ ]]
            gh attestation verify "release-bundle/$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --signer-digest "$SOURCE_COMMIT" \
              --source-digest "$SOURCE_COMMIT" \
              --source-ref "refs/tags/$RELEASE_TAG" \
              --deny-self-hosted-runners
          done < release-bundle/SHA256SUMS

      - name: Reconcile and publish GitHub Releases
        shell: bash
        run: |
          set -euo pipefail

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          releases_for_tag() {
            local tag="$1"
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -c --arg tag "$tag" '[.[][] | select(.tag_name == $tag)]'
          }

          single_release_for_tag() {
            local tag="$1" matches count
            matches="$(releases_for_tag "$tag")"
            count="$(jq 'length' <<<"$matches")"
            if [[ "$count" -gt 1 ]]; then
              echo "multiple releases exist for tag $tag" >&2
              return 1
            fi
            jq -c '.[0] // empty' <<<"$matches"
          }

          release_for_id() {
            local release_id="$1"
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id"
          }

          resolve_tag_commit() {
            local tag="$1" object_type object_sha payload depth
            payload="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")"
            object_type="$(jq -r '.object.type' <<<"$payload")"
            object_sha="$(jq -r '.object.sha' <<<"$payload")"
            for ((depth = 1; depth <= 16; depth++)); do
              case "$object_type" in
                commit)
                  printf '%s\n' "$object_sha"
                  return 0
                  ;;
                tag)
                  payload="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
                  object_type="$(jq -r '.object.type' <<<"$payload")"
                  object_sha="$(jq -r '.object.sha' <<<"$payload")"
                  ;;
                *)
                  echo "tag $tag resolves to unexpected object type $object_type" >&2
                  return 1
                  ;;
              esac
            done
            echo "tag $tag exceeds the annotated-tag peel limit" >&2
            return 1
          }

          assert_release_metadata() {
            local release_json="$1" tag="$2" target="$3" title="$4" prerelease="$5"
            local actual_tag actual_target actual_title actual_prerelease
            actual_tag="$(jq -r '.tag_name' <<<"$release_json")"
            actual_target="$(jq -r '.target_commitish' <<<"$release_json")"
            actual_title="$(jq -r '.name' <<<"$release_json")"
            actual_prerelease="$(jq -r '.prerelease' <<<"$release_json")"
            if [[ "$actual_tag" != "$tag" || "$actual_target" != "$target" ||
                  "$actual_title" != "$title" || "$actual_prerelease" != "$prerelease" ]]; then
              echo "release metadata mismatch for $tag: tag=$actual_tag target=$actual_target title=$actual_title prerelease=$actual_prerelease" >&2
              return 1
            fi
          }

          reconcile_assets() {
            local release_json="$1" allow_upload="$2"
            shift 2
            local files=("$@") expected_names=() name existing_name found count asset_id asset_state downloaded encoded upload_url
            local release_id attempt converged
            release_id="$(jq -r '.id' <<<"$release_json")"

            for file in "${files[@]}"; do
              expected_names+=("$(basename "$file")")
            done
            while IFS= read -r existing_name; do
              found=false
              for name in "${expected_names[@]}"; do
                if [[ "$existing_name" == "$name" ]]; then found=true; break; fi
              done
              if [[ "$found" != true ]]; then
                echo "unexpected release asset for id $release_id: $existing_name" >&2
                return 1
              fi
            done < <(jq -r '.assets[].name' <<<"$release_json")

            for file in "${files[@]}"; do
              name="$(basename "$file")"
              converged=false
              for attempt in 1 2 3; do
                release_json="$(release_for_id "$release_id")"
                count="$(jq --arg name "$name" '[.assets[] | select(.name == $name)] | length' <<<"$release_json")"
                if [[ "$count" -gt 1 ]]; then
                  echo "duplicate release asset for id $release_id: $name" >&2
                  return 1
                fi
                if [[ "$count" -eq 1 ]]; then
                  asset_id="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .id' <<<"$release_json")"
                  asset_state="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .state // "unknown"' <<<"$release_json")"
                  downloaded="$work/$release_id-$asset_id-$attempt-$name"
                  if [[ "$asset_state" != starter ]] &&
                      gh api -H 'Accept: application/octet-stream' \
                        "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" >"$downloaded" &&
                      cmp "$file" "$downloaded"; then
                    converged=true
                    break
                  fi
                  if [[ "$allow_upload" != true || "$(jq -r '.draft' <<<"$release_json")" != true ]]; then
                    echo "release asset differs byte-for-byte for id $release_id: $name state=$asset_state" >&2
                    return 1
                  fi
                  echo "removing incomplete draft asset before retry $attempt: $name state=$asset_state" >&2
                  if ! gh api --method DELETE \
                      "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" >/dev/null; then
                    echo "asset delete raced or failed, verifying remote state: $name" >&2
                  fi
                  release_json="$(release_for_id "$release_id")"
                  count="$(jq --arg name "$name" '[.assets[] | select(.name == $name)] | length' <<<"$release_json")"
                  if [[ "$count" -gt 0 ]]; then
                    continue
                  fi
                fi

                if [[ "$allow_upload" != true ]]; then
                  echo "published release asset is missing for id $release_id: $name" >&2
                  return 1
                fi
                if [[ "$(jq -r '.draft' <<<"$release_json")" != true ]]; then
                  echo "release became published before asset upload for id $release_id: $name" >&2
                  return 1
                fi
                encoded="$(jq -rn --arg value "$name" '$value | @uri')"
                upload_url="https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$encoded"
                if ! gh api --method POST \
                    -H 'Content-Type: application/octet-stream' \
                    --input "$file" "$upload_url" >/dev/null; then
                  echo "asset upload raced or failed, verifying remote state: $name" >&2
                fi
              done
              if [[ "$converged" != true ]]; then
                release_json="$(release_for_id "$release_id")"
                count="$(jq --arg name "$name" '[.assets[] | select(.name == $name)] | length' <<<"$release_json")"
                if [[ "$count" -eq 1 ]]; then
                  asset_id="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .id' <<<"$release_json")"
                  asset_state="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .state // "unknown"' <<<"$release_json")"
                  downloaded="$work/$release_id-$asset_id-final-$name"
                  if [[ "$asset_state" != starter ]] &&
                      gh api -H 'Accept: application/octet-stream' \
                        "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" >"$downloaded" &&
                      cmp "$file" "$downloaded"; then
                    converged=true
                  fi
                fi
              fi
              if [[ "$converged" != true ]]; then
                echo "release asset upload did not converge after 3 attempts and a final read-only probe for id $release_id: $name" >&2
                return 1
              fi
            done

            release_json="$(release_for_id "$release_id")"
            for name in "${expected_names[@]}"; do
              count="$(jq --arg name "$name" '[.assets[] | select(.name == $name)] | length' <<<"$release_json")"
              if [[ "$count" -ne 1 ]]; then
                echo "final release asset set mismatch for id $release_id: $name count=$count" >&2
                return 1
              fi
            done
            count="$(jq '.assets | length' <<<"$release_json")"
            if [[ "$count" -ne "${#files[@]}" ]]; then
              echo "release asset count mismatch for id $release_id: got $count want ${#files[@]}" >&2
              return 1
            fi
          }

          create_or_resume_draft() {
            local tag="$1" target="$2" title="$3" prerelease="$4" latest="$5" generate_notes="$6"
            local release_json create_args
            release_json="$(single_release_for_tag "$tag")"
            if [[ -n "$release_json" ]]; then
              printf '%s\n' "$release_json"
              return 0
            fi

            create_args=(
              --method POST "repos/$GITHUB_REPOSITORY/releases"
              -f "tag_name=$tag"
              -f "target_commitish=$target"
              -f "name=$title"
              -F draft=true
              -F "prerelease=$prerelease"
              -f "make_latest=$latest"
            )
            if [[ "$generate_notes" == true ]]; then
              create_args+=( -F generate_release_notes=true )
            else
              create_args+=( -f 'body=Pinned Windows amd64 native runtime for miniapp-bridge.' )
            fi
            if ! release_json="$(gh api "${create_args[@]}")"; then
              release_json="$(single_release_for_tag "$tag")"
              if [[ -z "$release_json" ]]; then
                echo "draft creation failed without a recoverable release for $tag" >&2
                return 1
              fi
            fi
            printf '%s\n' "$release_json"
          }

          publish_reconciled_draft() {
            local release_json="$1" tag="$2" target="$3" title="$4" prerelease="$5" latest="$6"
            shift 6
            local files=("$@") release_id refreshed remote_commit
            assert_release_metadata "$release_json" "$tag" "$target" "$title" "$prerelease"
            if [[ "$(jq -r '.draft' <<<"$release_json")" != true ]]; then
              echo "release $tag is already published" >&2
              return 1
            fi
            release_id="$(jq -r '.id' <<<"$release_json")"
            reconcile_assets "$release_json" true "${files[@]}"

            refreshed="$(release_for_id "$release_id")"
            assert_release_metadata "$refreshed" "$tag" "$target" "$title" "$prerelease"
            reconcile_assets "$refreshed" false "${files[@]}"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              remote_commit="$(resolve_tag_commit "$tag")"
              if [[ "$remote_commit" != "$target" ]]; then
                echo "remote tag $tag moved: expected $target, got $remote_commit" >&2
                return 1
              fi
            elif [[ "$tag" == "$RELEASE_TAG" ]]; then
              echo "product tag disappeared before publication: $tag" >&2
              return 1
            fi
            if ! gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
                -F draft=false \
                -F "prerelease=$prerelease" \
                -f "make_latest=$latest" >/dev/null; then
              echo "release publish request failed, verifying remote state: $tag" >&2
            fi
            refreshed="$(release_for_id "$release_id")"
            if [[ "$(jq -r '.draft' <<<"$refreshed")" != false ]]; then
              echo "release $tag did not publish" >&2
              return 1
            fi
            assert_release_metadata "$refreshed" "$tag" "$target" "$title" "$prerelease"
            reconcile_assets "$refreshed" false "${files[@]}"
            remote_commit="$(resolve_tag_commit "$tag")"
            if [[ "$remote_commit" != "$target" ]]; then
              echo "published tag $tag moved: expected $target, got $remote_commit" >&2
              return 1
            fi
          }

          if [[ "$NATIVE_TAG" != "native-v17.3.2-abi1.1" ]]; then
            echo "unexpected native compatibility tag: $NATIVE_TAG" >&2
            exit 1
          fi

          product_title="miniapp-bridge $RELEASE_TAG"
          product_prerelease=false
          release_core="${RELEASE_VERSION%%+*}"
          if [[ "$release_core" == *-* ]]; then product_prerelease=true; fi
          product_files=(
            "release-bundle/miniapp-bridge-$RELEASE_TAG-windows-amd64.zip"
            "release-bundle/$NATIVE_ASSET"
            "release-bundle/manifest.json"
            "release-bundle/miniapp-bridge.cdx.json"
            "release-bundle/provenance.intoto.json"
            "release-bundle/LICENSE"
            "release-bundle/THIRD_PARTY_NOTICES.md"
            "release-bundle/FRIDA_COPYING"
            "release-bundle/FRIDA_COPYING.LIB"
            "release-bundle/ZLIB_LICENSE"
            "release-bundle/SHA256SUMS"
          )
          product_release="$(single_release_for_tag "$RELEASE_TAG")"
          product_already_published=false
          if [[ -n "$product_release" ]]; then
            assert_release_metadata "$product_release" "$RELEASE_TAG" "$SOURCE_COMMIT" "$product_title" "$product_prerelease"
            if [[ "$(jq -r '.draft' <<<"$product_release")" == false ]]; then
              reconcile_assets "$product_release" false "${product_files[@]}"
              product_already_published=true
            fi
          fi

          remote_product_commit="$(resolve_tag_commit "$RELEASE_TAG")"
          if [[ "$remote_product_commit" != "$SOURCE_COMMIT" ]]; then
            echo "remote tag $RELEASE_TAG moved: expected $SOURCE_COMMIT, got $remote_product_commit" >&2
            exit 1
          fi

          native_title='miniapp-bridge native 17.3.2-abi1.1'
          native_files=(
            "release-bundle/native-compat/$NATIVE_ASSET"
            "release-bundle/native-compat/SHA256SUMS"
          )
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$NATIVE_TAG" >/dev/null 2>&1; then
            native_target="$(resolve_tag_commit "$NATIVE_TAG")"
          else
            native_target="$SOURCE_COMMIT"
          fi
          native_release="$(single_release_for_tag "$NATIVE_TAG")"
          if [[ -n "$native_release" && "$(jq -r '.draft' <<<"$native_release")" == false ]]; then
            assert_release_metadata "$native_release" "$NATIVE_TAG" "$native_target" "$native_title" false
            reconcile_assets "$native_release" false "${native_files[@]}"
          else
            native_release="$(create_or_resume_draft "$NATIVE_TAG" "$native_target" "$native_title" false false false)"
            publish_reconciled_draft "$native_release" "$NATIVE_TAG" "$native_target" "$native_title" false false "${native_files[@]}"
          fi
          remote_native_commit="$(resolve_tag_commit "$NATIVE_TAG")"
          if [[ "$remote_native_commit" != "$native_target" ]]; then
            echo "published native tag $NATIVE_TAG moved: expected $native_target, got $remote_native_commit" >&2
            exit 1
          fi

          if [[ "$product_already_published" == true ]]; then
            product_release="$(single_release_for_tag "$RELEASE_TAG")"
            assert_release_metadata "$product_release" "$RELEASE_TAG" "$SOURCE_COMMIT" "$product_title" "$product_prerelease"
            reconcile_assets "$product_release" false "${product_files[@]}"
            remote_product_commit="$(resolve_tag_commit "$RELEASE_TAG")"
            if [[ "$remote_product_commit" != "$SOURCE_COMMIT" ]]; then
              echo "remote tag $RELEASE_TAG moved: expected $SOURCE_COMMIT, got $remote_product_commit" >&2
              exit 1
            fi
            echo "published product release is exact; no assets were overwritten: $RELEASE_TAG"
          else
            product_release="$(create_or_resume_draft "$RELEASE_TAG" "$SOURCE_COMMIT" "$product_title" "$product_prerelease" legacy true)"
            publish_reconciled_draft "$product_release" "$RELEASE_TAG" "$SOURCE_COMMIT" "$product_title" "$product_prerelease" legacy "${product_files[@]}"
          fi
          remote_product_commit="$(resolve_tag_commit "$RELEASE_TAG")"
          if [[ "$remote_product_commit" != "$SOURCE_COMMIT" ]]; then
            echo "published product tag $RELEASE_TAG moved: expected $SOURCE_COMMIT, got $remote_product_commit" >&2
            exit 1
          fi
