name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.26.x
  ACTIONLINT_VERSION: 1.7.7
  GOVULNCHECK_VERSION: v1.6.0
  FRIDA_CORE_VERSION: 17.3.2
  ZLIB_VERSION: 1.3.1
  ZLIB_ARCHIVE_SHA256: 17E88863F3600672AB49182F217281B6FC4D3C762BDE361935E436A95214D05C

jobs:
  linux:
    name: Linux untagged
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Verify module graph
        shell: bash
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check Go formatting
        shell: bash
        run: |
          mapfile -d '' go_files < <(git ls-files -z -- '*.go')
          unformatted="$(gofmt -l "${go_files[@]}")"
          if [[ -n "$unformatted" ]]; then
            printf 'The following tracked Go files require gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Lint GitHub Actions workflows
        shell: bash
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@v${ACTIONLINT_VERSION}" -ignore 'unexpected key.*queue.*concurrency'

      - name: Unit tests
        shell: bash
        run: |
          mkdir -p ci-artifacts
          set -o pipefail
          go test ./... -count=1 -timeout 120s 2>&1 | tee ci-artifacts/linux-unit.log

      - name: Vet
        shell: bash
        run: |
          set -o pipefail
          go vet ./... 2>&1 | tee ci-artifacts/linux-vet.log

      - name: Scan reachable Go vulnerabilities
        shell: bash
        run: |
          set -o pipefail
          go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./... 2>&1 | tee ci-artifacts/linux-govulncheck.log

      - name: Fuzz decoder and boundary smoke matrix
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            './internal/app:FuzzWebSocketDebugFrameDecode'
            './internal/app:FuzzCDPWebSocketFrameDecode'
            './internal/cdp:FuzzCDPJSONNumberCanonicalization'
            './internal/cdp:FuzzCDPIDKeyTypeBoundaries'
            './internal/capture:FuzzCaptureDecode'
            './internal/capture:FuzzCaptureBoundaryArithmetic'
            './internal/native:FuzzNativeManifestDecode'
            './internal/native:FuzzNativeManifestTrustBoundaries'
            './internal/wmpf:FuzzWMPFDebugMessageDecode'
            './internal/wmpf:FuzzWMPFGenericDecode'
            './internal/wmpf:FuzzWMPFCommandDecode'
            './internal/wmpf:FuzzWMPFZlibBoundedRoundTrip'
            './internal/wmpf:FuzzWMPFZlibDecode'
          )
          {
            for spec in "${targets[@]}"; do
              package="${spec%%:*}"
              target="${spec#*:}"
              printf '=== fuzz %s %s ===\n' "$package" "$target"
              go test "$package" -run '^$' -fuzz "^${target}$" -fuzztime=2s -parallel=1 -timeout=90s
            done
          } 2>&1 | tee ci-artifacts/linux-fuzz.log

      - name: Deterministic soak and chaos matrix
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/app \
            -run '^(TestSingleOwnerReconnectDeterministicSoak|TestWSClientQueueAccountingDeterministicSoak|TestWSClientWriterFaultAndConcurrentShutdownChaos)$' \
            -count=20 -timeout=300s 2>&1 | tee ci-artifacts/linux-soak-chaos.log
          go test ./internal/capture \
            -run '^(TestSegmentedRecorderRotationRetentionAndReplay|TestSegmentedProductionReplayCompatibility|TestSegmentedRecorderDiskBackpressureAndDrainBudget)$' \
            -count=10 -timeout=300s 2>&1 | tee ci-artifacts/linux-capture-soak.log

      - name: Race tests
        shell: bash
        run: |
          set -o pipefail
          go test -race ./... -count=1 -timeout 240s 2>&1 | tee ci-artifacts/linux-race.log

      - name: Upload Linux test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-test-logs-${{ github.run_id }}
          path: ci-artifacts/**
          if-no-files-found: warn
          retention-days: 7

  windows:
    name: Windows native and coverage
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Restore pinned native caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/downloads/frida-core-devkit-17.3.2-windows-x86_64.tar.xz
            third_party/downloads/cache/zlib-1.3.1.tar.gz
          key: native-${{ runner.os }}-${{ runner.arch }}-frida-${{ env.FRIDA_CORE_VERSION }}-zlib-${{ env.ZLIB_VERSION }}-${{ env.ZLIB_ARCHIVE_SHA256 }}-${{ hashFiles('go.sum') }}

      - name: Populate Frida devkit archive cache
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = 'third_party\downloads\frida-core-devkit-17.3.2-windows-x86_64.tar.xz'
          $expected = '8AF15423D6E534626F91A67FAA0582E42C67A07A95A190F4C622695105549C72'
          $archiveValid = (Test-Path -LiteralPath $archive) -and ((Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash -eq $expected)
          if ($archiveValid) {
            Write-Host 'Pinned Frida archive cache is valid'
            exit 0
          }
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $archive) | Out-Null
          $asset = Split-Path -Leaf $archive
          Write-Host "Fetching pinned Frida asset with authenticated GitHub CLI: $asset"
          gh release download $env:FRIDA_CORE_VERSION --repo frida/frida --pattern $asset --output $archive --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release download failed with exit $LASTEXITCODE" }
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToUpperInvariant()
          if ($actual -ne $expected) {
            Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
            throw "Frida devkit archive SHA-256 mismatch: expected $expected, got $actual"
          }
          Write-Host "Frida devkit archive verified: sha256=$actual"

      - name: Configure Windows build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mingw = @(
            'C:\mingw64\bin',
            'C:\msys64\mingw64\bin',
            'C:\ProgramData\mingw64\mingw64\bin'
          ) | Where-Object {
            (Test-Path (Join-Path $_ 'gcc.exe')) -and
            (Test-Path (Join-Path $_ 'ar.exe'))
          } | Select-Object -First 1
          if (-not $mingw) { throw 'GitHub Windows runner does not provide gcc.exe and ar.exe' }
          $mingw | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          $expected = 'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools'
          if (-not (Test-Path (Join-Path $expected 'Common7\Tools\VsDevCmd.bat'))) {
            $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
            $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $installation -or -not (Test-Path (Join-Path $installation 'Common7\Tools\VsDevCmd.bat'))) {
              throw 'Visual Studio 2022 C++ build tools were not found'
            }
            New-Item -ItemType Directory -Force -Path (Split-Path $expected) | Out-Null
            New-Item -ItemType Junction -Path $expected -Target $installation | Out-Null
          }

      - name: Windows native build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path ci-artifacts | Out-Null
          $zlibSource = 'third_party\zlib\src-1.3.1'
          if (Test-Path -LiteralPath $zlibSource) {
            Remove-Item -LiteralPath $zlibSource -Recurse -Force
          }
          & .\scripts\build-windows.ps1 *>&1 | Tee-Object -FilePath ci-artifacts\windows-native-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Windows update rollback soak
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./scripts `
            -run '^(TestNativePrepare(MultiRoundUpdateSoak|VersionedPublishRollbackAndRetention|CanaryFailureRollsBack|RecoversInterruptedPublishJournal))$' `
            -count=3 -timeout=300s *>&1 |
            Tee-Object -FilePath ci-artifacts\windows-update-soak.log
          if ($LASTEXITCODE -ne 0) { throw "Windows update rollback soak failed with exit $LASTEXITCODE" }

      - name: Scan tagged Go vulnerabilities and vet
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = (Resolve-Path 'third_party\frida\runtime-17.3.2').Path
          $env:PATH = "$runtime;$env:PATH"
          $env:MINIAPP_BRIDGE_NATIVE_PATH = Join-Path $runtime 'miniapp-frida.dll'
          go vet -tags=frida ./... *>&1 | Tee-Object -FilePath ci-artifacts\windows-tagged-vet.log
          if ($LASTEXITCODE -ne 0) { throw "tagged go vet failed with exit $LASTEXITCODE" }
          go run "golang.org/x/vuln/cmd/govulncheck@$env:GOVULNCHECK_VERSION" -tags=frida ./... *>&1 |
            Tee-Object -FilePath ci-artifacts\windows-tagged-govulncheck.log
          if ($LASTEXITCODE -ne 0) { throw "tagged govulncheck failed with exit $LASTEXITCODE" }

      - name: Fuzz tagged native zlib smoke matrix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = (Resolve-Path 'third_party\frida\runtime-17.3.2').Path
          $env:PATH = "$runtime;$env:PATH"
          $env:MINIAPP_BRIDGE_NATIVE_PATH = Join-Path $runtime 'miniapp-frida.dll'
          foreach ($target in @('FuzzWMPFZlibBoundedRoundTrip', 'FuzzWMPFZlibDecode')) {
            Write-Output "=== tagged fuzz ./internal/wmpf $target ===" |
              Tee-Object -FilePath ci-artifacts\windows-tagged-fuzz.log -Append
            go test -tags=frida ./internal/wmpf -run '^$' -fuzz "^${target}$" -fuzztime=2s -parallel=1 -timeout=90s *>&1 |
              Tee-Object -FilePath ci-artifacts\windows-tagged-fuzz.log -Append
            if ($LASTEXITCODE -ne 0) { throw "tagged fuzz $target failed with exit $LASTEXITCODE" }
          }

      - name: Enforce PE architecture imports and security flags
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vsdev = 'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\Common7\Tools\VsDevCmd.bat'
          $targets = [ordered]@{
            'dist\miniapp-bridge.exe' = @('kernel32.dll')
            'dist\miniapp-frida.dll' = @(
              'advapi32.dll', 'bcrypt.dll', 'crypt32.dll', 'dnsapi.dll', 'gdi32.dll',
              'iphlpapi.dll', 'kernel32.dll', 'ole32.dll', 'psapi.dll', 'setupapi.dll',
              'shell32.dll', 'shlwapi.dll', 'user32.dll', 'ws2_32.dll'
            )
          }
          foreach ($entry in $targets.GetEnumerator()) {
            $path = (Resolve-Path $entry.Key).Path
            $headers = cmd.exe /d /s /c ('call "{0}" -arch=x64 -host_arch=x64 >nul && dumpbin /headers "{1}"' -f $vsdev, $path)
            if ($LASTEXITCODE -ne 0) { throw "dumpbin headers failed for $path" }
            $headerText = $headers -join "`n"
            foreach ($marker in @('8664 machine (x64)', '20B magic # (PE32+)', 'High Entropy Virtual Addresses', 'Dynamic base', 'NX compatible')) {
              if ($headerText -cnotmatch [regex]::Escape($marker)) { throw "$path is missing PE marker: $marker" }
            }
            if ($headerText -notmatch '(?m)^\s*0 \[\s*0\] RVA \[size\] of Delay Import Directory\s*$') {
              throw "$path contains delay imports"
            }
            foreach ($section in [regex]::Matches($headerText, '(?ms)^SECTION HEADER.*?(?=^SECTION HEADER|\z)')) {
              if ($section.Value -match '(?m)^\s*Execute\s*$' -and $section.Value -match '(?m)^\s*Write\s*$') {
                throw "$path contains a writable executable PE section"
              }
            }

            $dependents = cmd.exe /d /s /c ('call "{0}" -arch=x64 -host_arch=x64 >nul && dumpbin /dependents "{1}"' -f $vsdev, $path)
            if ($LASTEXITCODE -ne 0) { throw "dumpbin dependents failed for $path" }
            $actual = @($dependents | ForEach-Object {
              if ($_ -match '^\s+([A-Za-z0-9_.-]+\.dll)\s*$') { $Matches[1].ToLowerInvariant() }
            } | Sort-Object -Unique)
            $unexpected = @($actual | Where-Object {
              $_ -notin $entry.Value -and $_ -notlike 'api-ms-win-crt-*.dll'
            })
            $missing = @($entry.Value | Where-Object { $_ -notin $actual })
            if ($unexpected.Count -ne 0 -or $missing.Count -ne 0) {
              throw "$path import allowlist mismatch; missing=$($missing -join ','); unexpected=$($unexpected -join ',')"
            }
            Write-Output "pe-gate=$path imports=$($actual -join ',')"
          }

      - name: PowerShell command coverage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\powershell-coverage.ps1 *>&1 | Tee-Object -FilePath ci-artifacts\powershell-coverage-run.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Complete Windows coverage gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\coverage-gate.ps1 *>&1 | Tee-Object -FilePath ci-artifacts\windows-coverage-gate.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package and verify Windows release layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\package-windows-release.ps1 -Version v0.0.0-ci *>&1 |
            Tee-Object -FilePath ci-artifacts\windows-package.log
          if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "Windows packaging failed with exit $LASTEXITCODE" }
          foreach ($sumFile in @('dist\release\SHA256SUMS', 'dist\release\native-compat\SHA256SUMS')) {
            $directory = Split-Path -Parent $sumFile
            foreach ($line in Get-Content -LiteralPath $sumFile) {
              if ($line -notmatch '^([0-9A-Fa-f]{64})  ([^\\/]+)$') { throw "invalid checksum line in ${sumFile}: $line" }
              $asset = Join-Path $directory $Matches[2]
              $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash
              if ($actual -cne $Matches[1].ToUpperInvariant()) { throw "checksum mismatch for $asset" }
            }
          }

      - name: Upload Windows verification logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-verification-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload trusted Windows binaries
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-binaries-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/miniapp-bridge.exe
            dist/miniapp-frida.dll
            dist/manifest.json
            dist/native/miniapp-frida-native-17.3.2-abi1-windows-amd64.zip
            dist/native/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
